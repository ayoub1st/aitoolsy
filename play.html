<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Play - AI Toolsy</title>
<link rel="stylesheet" href="assets/nav.css" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" href="assets/pages.css" />
<link rel="stylesheet" href="assets/games.css" />
<link rel="stylesheet" href="assets/play.css" />
</head>
<body data-current="games">

  <header class="app-topbar">
    <a href="guide.html" class="brand-lockup">
      <span class="brand-avatar">
        <img src="assets/media/logo-mark.png" alt="AI Toolsy" />
      </span>
      <span class="brand-name"><span class="brand-ai">Ai</span><span class="brand-rest">Toolsy</span></span>
    </a>
    <button id="menu-btn" class="menu-btn" type="button" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <div id="drawer-overlay" class="drawer-overlay" hidden></div>
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-header">
      <img src="assets/media/logo-mark.png" alt="AI Toolsy" />
      <span class="brand-name"><span class="brand-ai">Ai</span><span class="brand-rest">Toolsy</span></span>
      <button id="drawer-close" class="drawer-close" type="button" aria-label="Close menu">&times;</button>
    </div>

    <button class="drawer-item" data-page="guide" data-i18n="nav.home">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </button>
    <button class="drawer-item" data-page="blog" data-i18n="nav.blog">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="12" y2="17"/></svg>
      Blog
    </button>
    <button class="drawer-item" data-page="bookmarks" data-i18n="nav.bookmarks">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
      Bookmarks
    </button>
    <button class="drawer-item" data-page="faq" data-i18n="nav.faq">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.7-2.5 1.9-2.5 3.6"/><line x1="12" y1="16.5" x2="12" y2="16.6"/></svg>
      FAQ / Help Center
    </button>

    <button class="drawer-item" data-page="games" data-i18n="nav.games">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="12" r="1.4"/><circle cx="15.5" cy="10" r="1.4"/><circle cx="15.5" cy="14" r="1.4"/></svg>
      Games
    </button>

    <div class="drawer-section">
      <button class="drawer-item" id="lang-toggle" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3c2.5 2.6 4 6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-6-4-9s1.5-6.4 4-9z"/></svg>
        <span data-i18n="nav.languages">Languages</span>
        <span class="plus">+</span>
      </button>
      <div class="drawer-sub" id="lang-list">
        <button class="drawer-sub-item lang-option" data-lang="en">English</button>
        <button class="drawer-sub-item lang-option" data-lang="fr">Français</button>
        <button class="drawer-sub-item lang-option" data-lang="ar">العربية</button>
        <button class="drawer-sub-item lang-option" data-lang="de">Deutsch</button>
        <button class="drawer-sub-item lang-option" data-lang="es">Español</button>
      </div>
    </div>

    <div class="drawer-spacer"></div>

    <div class="drawer-bottom">
      <button class="drawer-item" data-page="about" data-i18n="nav.about">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="7.5" x2="12" y2="7.6"/></svg>
        About Us
      </button>
      <button class="drawer-item" id="support-toggle" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M4 13v4a2 2 0 0 0 2 2h1v-6H5a1 1 0 0 0-1 1z"/><path d="M20 13v4a2 2 0 0 1-2 2h-1v-6h1a1 1 0 0 1 1 1z"/></svg>
        <span data-i18n="nav.support">Support</span>
        <span class="plus">+</span>
      </button>
      <div class="drawer-sub" id="support-list">
        <div class="drawer-sub-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <span>Email (to be added)</span>
        </div>
        <div class="drawer-sub-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 8h-2a2 2 0 0 0-2 2v2H9v3h2v7h3v-7h2.2L17 13h-3v-1.5c0-.6.4-1 1-1h2V8z"/></svg>
          <span>Facebook (coming soon)</span>
        </div>
        <div class="drawer-sub-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
          <span>Instagram (coming soon)</span>
        </div>
        <div class="drawer-sub-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v10.5a3.5 3.5 0 1 1-3-3.46"/><path d="M14 3c.5 2.5 2.3 4.2 5 4.5"/></svg>
          <span>TikTok (coming soon)</span>
        </div>
      </div>
    </div>
  </aside>
  <div class="page-wrap">
    <div class="content-wrap play-content-wrap">
      <div class="play-topbar">
        <a href="games.html" class="back-btn"><span aria-hidden="true">←</span> All games</a>
        <div class="play-actions">
          <button type="button" class="game-btn" id="play-restart-btn">↻ Restart</button>
        </div>
      </div>
      <h1 class="play-title" id="play-title">Game</h1>
      <div id="play-mount" class="play-mount"></div>
    </div>
  </div>

  <footer class="site-footer">
    <span>&copy; AMA</span>
  </footer>

  <script src="assets/i18n.js"></script>
  <script src="assets/play.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/motion.js"></script>
</body>
</html>
